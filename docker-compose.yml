volumes:
    logs:
      name: thpsbot_logs
    json:
      name: thpsbot_json

services:
  thpsbot:
    container_name: thpsbot
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - .:/app:z
      - logs:/app/logs:rw
      - json:/app/json:rw
    networks:
      - thpsbot
      - backend_thpsrun

networks:
  thpsbot:
    driver: bridge
  backend_thpsrun:
    external: true